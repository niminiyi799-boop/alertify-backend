security:
    # enable_authenticator_manager: true

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login
                provider: app_user_provider
                username_path: email
                password_path: password

        api:
            pattern: ^/api
            stateless: true
            jwt: ~           # ✅ This works because Lexik JWT bundle is installed

    access_control:
        - { path: ^/api/login, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/api, roles: ROLE_USER }
